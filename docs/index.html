<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single-Cell Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <h1 id="site-title">Single-Cell Atlas</h1>
  </div>
  <nav id="dataset-tabs" class="tabs" aria-label="Datasets"></nav>
  <button id="theme-toggle" class="icon-btn" title="Toggle light/dark" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
</header>

<main class="layout">
  <aside class="side">
    <section class="panel">
      <div id="ds-info" class="ds-info"></div>
    </section>

    <section class="panel">
      <label class="lbl" for="color-field">Color by</label>
      <select id="color-field"></select>

      <label class="lbl" for="gene-input">Gene</label>
      <div class="gene-search">
        <input id="gene-input" type="text" placeholder="e.g. CD68" autocomplete="off" spellcheck="false">
        <ul id="gene-suggest" class="suggest" role="listbox"></ul>
      </div>
      <div class="row small">
        <label><input type="checkbox" id="split-toggle"> Split by</label>
        <select id="split-field" disabled></select>
      </div>
      <div class="row small">
        <label for="pt-size">Point size</label>
        <input type="range" id="pt-size" min="1" max="6" step="0.5" value="2">
      </div>
    </section>

    <section class="panel legend-panel">
      <div class="lbl-row"><span class="lbl" id="legend-title">Legend</span>
        <button id="legend-all" class="link-btn">show all</button></div>
      <div id="legend" class="legend"></div>
    </section>
  </aside>

  <section class="stage">
    <div class="plot-head">
      <div id="plot-title" class="plot-title"></div>
      <div class="plot-tools">
        <select id="embedding"></select>
        <button id="reset-view" class="btn">Reset view</button>
        <button id="save-png" class="btn">PNG</button>
      </div>
    </div>
    <div id="canvas-wrap" class="canvas-wrap">
      <div id="grid" class="grid"></div>
      <div id="tooltip" class="tooltip" hidden></div>
      <div id="loading" class="loading">Loading…</div>
    </div>

    <div class="lower">
      <div class="tabs sub" role="tablist">
        <button class="tab active" data-tab="dot">Dot plot</button>
        <button class="tab" data-tab="violin">Violin</button>
      </div>
      <div id="tab-dot" class="tabpane">
        <div class="row">
          <input id="dot-genes" type="text" spellcheck="false" placeholder="Genes, comma or space separated">
          <select id="dot-group"></select>
          <button id="dot-run" class="btn primary">Plot</button>
        </div>
        <div id="dot-plot" class="chart"></div>
      </div>
      <div id="tab-violin" class="tabpane" hidden>
        <div class="row small muted" id="violin-hint">Pick a gene above; grouped by
          <select id="violin-group"></select></div>
        <div id="violin-plot" class="chart"></div>
      </div>
    </div>
  </section>
</main>

<footer class="foot" id="footer"></footer>
<script src="app.js"></script>
</body>
</html>
